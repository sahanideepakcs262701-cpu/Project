<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classic Collection - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f2ed;
            padding: 20px;
        }

        .container {
            width: 900px;
            min-height: 550px;
            display: flex;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        /* LEFT SIDE */

        .left {
            width: 50%;
            background: #171717;
            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;

            padding: 60px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .logo span {
            color: #c29b62;
        }

        .line {
            width: 70px;
            height: 3px;
            background: #c29b62;
            margin: 22px 0;
        }

        .left h2 {
            font-size: 42px;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .left p {
            color: #cccccc;
            font-size: 16px;
            line-height: 1.7;
            max-width: 330px;
        }

        /* RIGHT SIDE */

        .right {
            width: 50%;
            padding: 55px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right h1 {
            color: #171717;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;

            border: 1px solid #dddddd;
            border-radius: 8px;

            font-size: 15px;

            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #c29b62;
            box-shadow: 0 0 5px rgba(194, 155, 98, 0.25);
        }

        .password {
            padding-right: 45px;
        }

        .eye {
            position: absolute;
            right: 14px;
            top: 13px;

            cursor: pointer;
            font-size: 18px;
        }

        /* FORGOT PASSWORD */

        .forgot {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 25px;
        }

        .forgot a {
            color: #a57d43;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        /* LOGIN BUTTON */

        .login-btn {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 8px;

            background: #b08d57;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background: #96733f;
            transform: translateY(-1px);
        }

        /* MESSAGE */

        .message {
            display: none;
            text-align: center;

            margin-top: 15px;

            font-size: 14px;
            font-weight: bold;
        }

        /* REGISTER */

        .register {
            text-align: center;
            margin-top: 25px;

            color: #777;
            font-size: 14px;
        }

        .register a {
            color: #a57d43;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .container {
                width: 100%;
                min-height: auto;
            }

            .left {
                display: none;
            }

            .right {
                width: 100%;
                padding: 40px 30px;
            }
        }

    </style>
</head>


<body>

    <div class="container">

        <!-- LEFT SECTION -->

        <div class="left">

            <div class="logo">
                CLASSIC <span>COLLECTION</span>
            </div>

            <div class="line"></div>

            <h2>
                Fashion<br>
                For Everyone
            </h2>

            <p>
                Timeless styles. Modern fashion.
                Discover clothing designed for
                every occasion.
            </p>

        </div>


        <!-- RIGHT SECTION -->

        <div class="right">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to your Classic Collection account
            </p>


            <form id="loginForm">

                <!-- USERNAME -->

                <label for="username">
                    Email / Username
                </label>

                <div class="input-box">

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your email or username"
                    >

                </div>


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        class="password"
                        placeholder="Enter your password"
                    >

                    <span
                        class="eye"
                        onclick="showPassword()"
                        id="eye"
                    >
                        👁
                    </span>

                </div>


                <!-- FORGOT PASSWORD -->

                <div class="forgot">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    LOGIN
                </button>

            </form>


            <!-- MESSAGE -->

            <div
                class="message"
                id="message"
            ></div>


            <!-- CREATE ACCOUNT -->

            <div class="register">

                Don't have an account?

                <a href="#">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <script>

        // SHOW / HIDE PASSWORD

        function showPassword() {

            let password =
                document.getElementById("password");

            let eye =
                document.getElementById("eye");

            if (password.type === "password") {

                password.type = "text";
                eye.innerHTML = "🙈";

            } else {

                password.type = "password";
                eye.innerHTML = "👁";

            }

        }


        // LOGIN VALIDATION

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let username =
                    document
                    .getElementById("username")
                    .value
                    .trim();

                let password =
                    document
                    .getElementById("password")
                    .value
                    .trim();

                let message =
                    document.getElementById("message");


                if (username === "" || password === "") {

                    message.style.display = "block";
                    message.style.color = "red";

                    message.innerHTML =
                        "Please enter username and password.";

                    return;
                }


                message.style.display = "block";
                message.style.color = "green";

                message.innerHTML =
                    "Login successful!";

            });

    </script>

</body>
</html>
